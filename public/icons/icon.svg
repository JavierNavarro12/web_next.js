<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fondo -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Lupa -->
  <g transform="translate(128,128) scale(1)">
    <!-- Círculo (lente) -->
    <circle cx="128" cy="128" r="88" fill="none" stroke="url(#glass)" stroke-width="24"/>
    <!-- Mango -->
    <path d="M188 188 L260 260" stroke="url(#glass)" stroke-width="28" stroke-linecap="round"/>
    <!-- Brillo interior -->
    <circle cx="110" cy="110" r="12" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>