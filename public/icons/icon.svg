<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular negro -->
  <circle cx="256" cy="256" r="256" fill="#000000"/>
  
  <!-- Círculo interior con gradiente -->
  <circle cx="256" cy="256" r="200" fill="url(#gradient)"/>
  
  <!-- Texto "AI" -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="white">
    AI
  </text>
  
  <!-- Definición del gradiente -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B5563;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg> 